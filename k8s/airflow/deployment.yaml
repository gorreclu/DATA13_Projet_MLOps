apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
data:
  AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  PYTHONPATH: "/opt/airflow"
  MLFLOW_TRACKING_URI: "http://89.58.44.97:5000"
  MLFLOW_EXPERIMENT_NAME: "house-price-prediction"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_BUCKET_DATA: "mlops-data"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-logs-pvc
  labels:
    app: airflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  labels:
    app: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      initContainers:
        - name: airflow-db-migrate
          image: airflow-custom:latest
          imagePullPolicy: Never
          command:
            - bash
            - -c
            - >
              export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow"
              && airflow db migrate
          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: app-secrets
        - name: airflow-create-user
          image: airflow-custom:latest
          imagePullPolicy: Never
          command:
            - bash
            - -c
            - >
              export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow"
              && airflow users create
              --username admin
              --password admin
              --firstname Admin
              --lastname User
              --role Admin
              --email admin@example.com || true
          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: app-secrets
      containers:
        - name: airflow-webserver
          image: airflow-custom:latest
          imagePullPolicy: Never
          command:
            - bash
            - -c
            - >
              export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow"
              && airflow scheduler &
              export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow"
              && airflow webserver --port 8080
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: app-secrets
          volumeMounts:
            - name: airflow-logs
              mountPath: /opt/airflow/logs
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: airflow-logs
          persistentVolumeClaim:
            claimName: airflow-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  labels:
    app: airflow
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30808
  selector:
    app: airflow
