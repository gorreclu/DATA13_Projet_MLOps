apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-config
data:
  MLFLOW_TRACKING_URI: "http://89.58.44.97:5000"
  API_HOST: "api"
  API_PORT: "8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: house-price-webapp:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 7860
          envFrom:
            - configMapRef:
                name: webapp-config
          readinessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  labels:
    app: webapp
spec:
  type: NodePort
  ports:
    - port: 7860
      targetPort: 7860
      nodePort: 30786
  selector:
    app: webapp
