[project]
name = "house-price-mlops"
version = "0.1.0"
description = "MLOps project - House price prediction with XGBoost (DATA713)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "optuna>=3.6",
    "category-encoders>=2.6",
    "mlflow>=2.14",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "gradio>=4.36",
    "prometheus-client>=0.20",
    "python-dotenv>=1.0",
    "kaggle>=1.6",
    "pydantic>=2.7",
    "httpx>=0.27",
    "dill>=0.3",
    "joblib>=1.4",
    "boto3>=1.34",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
airflow = [
    "apache-airflow>=2.9",
]

[project.scripts]
download = "src.data.download:main"
train = "src.model.cli:train"
train-quick = "src.model.cli:train_quick"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
